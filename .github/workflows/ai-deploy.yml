name: AI Deploy Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Stage 1: Code quality ──────────────────────────────────────
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install ruff && ruff check app/

  # ── Stage 2: Unit + integration tests ─────────────────────────
  unit-tests:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: insurance_ai
          POSTGRES_USER: admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: Create test database
        run: PGPASSWORD=secret psql -h localhost -U admin -d insurance_ai -c "CREATE DATABASE insurance_ai_test;"
      - run: pip install -r requirements.txt
      - run: pytest tests/ -v --ignore=tests/evals
        env:
          DATABASE_URL: postgresql+asyncpg://admin:secret@localhost:5432/insurance_ai
          SYNC_DATABASE_URL: postgresql://admin:secret@localhost:5432/insurance_ai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: test@example.com

  # ── Stage 3: AI Eval Gate (blocks main merges) ────────────────
  eval-gate:
    runs-on: ubuntu-latest
    needs: unit-tests
    if: github.ref == 'refs/heads/main'
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: secret
          POSTGRES_DB: insurance_ai_eval
          POSTGRES_USER: admin
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r requirements.txt
      - name: Run schema migrations
        run: |
          PGPASSWORD=secret psql -h localhost -U admin -d insurance_ai_eval -f migrations/init.sql
          PGPASSWORD=secret psql -h localhost -U admin -d insurance_ai_eval -f migrations/agents.sql
          PGPASSWORD=secret psql -h localhost -U admin -d insurance_ai_eval -f migrations/governance.sql
      - name: Run AI Evaluation Gate
        run: python tests/evals/run_evals.py
        env:
          PYTHONPATH: .
          DATABASE_URL: postgresql+asyncpg://admin:secret@localhost:5432/insurance_ai_eval
          SYNC_DATABASE_URL: postgresql://admin:secret@localhost:5432/insurance_ai_eval
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SENDGRID_API_KEY: ${{ secrets.SENDGRID_API_KEY }}
          SENDGRID_FROM_EMAIL: noreply@example.com

  # ── Stage 4: Build Docker image ───────────────────────────────
  build:
    runs-on: ubuntu-latest
    needs: [unit-tests, eval-gate]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t insurance-advisor-ai:${{ github.sha }} .
      - name: Push to ECR
        run: |
          aws ecr get-login-password --region ap-south-1 \
            | docker login --username AWS --password-stdin ${{ secrets.ECR_REGISTRY }}
          docker tag insurance-advisor-ai:${{ github.sha }} \
            ${{ secrets.ECR_REGISTRY }}/insurance-advisor-ai:${{ github.sha }}
          docker push ${{ secrets.ECR_REGISTRY }}/insurance-advisor-ai:${{ github.sha }}
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}

  # ── Stage 5: Deploy to staging ────────────────────────────────
  deploy-staging:
    runs-on: ubuntu-latest
    needs: build
    environment: staging
    steps:
      - name: Deploy to ECS staging
        run: |
          aws ecs update-service \
            --cluster insurance-ai-staging \
            --service insurance-advisor-api \
            --force-new-deployment
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ap-south-1
